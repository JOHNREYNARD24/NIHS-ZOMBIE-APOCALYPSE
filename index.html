 <!DOCTYPE html>
<html lang="ceb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NIHS Zombie Apocalypse</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         INTRO
    ========================== -->

    <main id="intro">

        <!-- SCENE 1 -->
        <section class="scene scene-logo active" id="scene1">

            <img
                src="nihs.png"
                class="nihs-logo"
                alt="NIHS Logo"
            >

        </section>


        <!-- SCENE 2 -->
        <section class="scene" id="scene2">

            <h1>
                NEW ISRAEL HIGH SCHOOL
            </h1>

            <h2>
                ZOMBIE APOCALYPSE
            </h2>

        </section>


        <!-- SCENE 3 -->
        <section class="scene" id="scene3">

            <div class="developer">

                <p>
                    ANG KANI NGA DULA KAY
                </p>

                <strong>
                    GIBUHAT NI
                </strong>

                <h2>
                    JOHN REYNARD MIRAS
                </h2>

                <p>
                    SIYA ANG DEVELOPER ANI
                </p>

            </div>

        </section>


        <!-- SCENE 4 -->
        <section class="scene" id="scene4">

            <div class="warning">

                <h2>
                    TIMANI KINI NGA DULA
                </h2>

                <p>
                    KAY PANG LINGAW² RA.
                </p>

                <p>
                    AYAW SERYOSOHA ARON DI KA MAMATAY 😂
                </p>

            </div>

        </section>


        <!-- SCENE 5 -->
        <section class="scene final-scene" id="scene5">

            <div class="final-logo-wrap">

                <div class="blood-effect blood1"></div>
                <div class="blood-effect blood2"></div>
                <div class="blood-effect blood3"></div>

                <img
                    src="nihs.png"
                    class="final-logo"
                    alt="NIHS Logo"
                >

                <div class="game-name">
                    NIHS ZOMBIE APOCALYPSE
                </div>

            </div>


            <button id="startButton">
                START
            </button>

        </section>

    </main>


    <!-- =========================
         HOME MENU
    ========================== -->

    <main id="homeMenu">

        <div class="home-background"></div>

        <div class="home-overlay"></div>


        <section class="home-content">

            <img
                src="nihs.png"
                class="menu-logo"
                alt="NIHS Logo"
            >


            <h1 class="menu-title">
                NIHS ZOMBIE
            </h1>

            <h2 class="menu-subtitle">
                APOCALYPSE
            </h2>


            <div class="menu-buttons">

                <button
                    class="menu-button play-button"
                    id="playButton"
                >
                    <span class="button-icon">▶</span>
                    PLAY
                </button>


                <button
                    class="menu-button"
                    id="settingsButton"
                >
                    <span class="button-icon">⚙</span>
                    SETTINGS
                </button>


                <button
                    class="menu-button"
                    id="shopButton"
                >
                    <span class="button-icon">🛒</span>
                    SHOP
                </button>

            </div>


            <div class="menu-footer">
                NIHS ZOMBIE APOCALYPSE
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
